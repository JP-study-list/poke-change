<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>寶可夢交換所 · Pokémon GO 交換清單製作</title>
    <meta name="description" content="用圖鑑找出活動裝扮、地區型與背卡寶可夢，排出想要與可以給的交換清單，一鍵產生分享圖。" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!--
      骨架而已。所有內容由 js/ui.js 在執行時填入，
      這裡只保留容器與不會變的結構。

      圖示一律 inline SVG 不用文字符號。文字符號的字重與基線跨平台會飄，
      也吃不到 currentColor 以外的控制。
    -->
    <header class="topbar">
      <div class="brand">
        <strong id="appName">寶可夢交換所</strong>
        <span id="subtitle" class="dim"></span>
      </div>

      <!--
        三個檢視。桌機排在頂部列裡，900 以下同一段 DOM 變成貼底的 bar，
        跟右欄與那兩個面板同一個手法：位置只有一處，形態靠 CSS 切換。
      -->
      <nav class="views" id="views"></nav>

      <div class="top-right">
        <div class="langs" id="langs"></div>
        <button
          class="icon-btn"
          id="gearBtn"
          type="button"
          aria-expanded="false"
          aria-controls="settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M9.5 2.8 L14.5 2.8 L13.9 5.8 L16.4 7.2 L18.7 5.3 L21.2 9.5 L18.3 10.5 L18.3 13.5 L21.2 14.5 L18.7 18.7 L16.4 16.8 L13.9 18.2 L14.5 21.2 L9.5 21.2 L10.1 18.2 L7.6 16.8 L5.3 18.7 L2.8 14.5 L5.7 13.5 L5.7 10.5 L2.8 9.5 L5.3 5.3 L7.6 7.2 L10.1 5.8Z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>

      </div>
    </header>

    <!--
      資訊列。抄 Scryfall 頂部那條：現在在看哪一批、幾筆、篩掉了什麼。
      原本這些資訊是內容區裡一行 15px 的小標題，沒有地位。
    -->
    <div class="infobar" id="infobar"></div>

    <div class="layout">
      <main class="content">
        <!--
          搜尋列。36 個篩選條件收在漏斗裡，已選的那幾個排在漏斗右邊，
          沒選就什麼都不長，這一行只有搜尋框。

          面板放在搜尋列裡面，靠 absolute 浮在下方，所以不佔流排、
          不會把搜尋框推窄；900 以下同一段 DOM 變成底部抽屜。
        -->
        <div class="searchbar" id="searchbar">
          <input id="q" type="search" autocomplete="off" />
          <button
            class="icon-btn fbtn"
            id="filterBtn"
            type="button"
            aria-expanded="false"
            aria-controls="fpanel"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h18l-7 8.5V20l-4-2.5v-4z" />
            </svg>
            <span class="fbtn-n" id="filterN" hidden></span>
          </button>
          <div class="fpicked" id="fpicked"></div>
          <div class="pop fpanel" id="fpanel" hidden></div>
        </div>
        <div id="app"></div>
      </main>

      <!--
        右欄。1200 以上只有背卡是版面的第三欄，圖鑑與彈出形態都是置中視窗。
        DOM 位置只有一處，兩種形態靠 CSS 切換，繪製函式不必知道自己在哪。

        `.rail-inner` 是不捲的殼，`#panel` 才是捲動區，這樣右上角那顆 X
        才會一直留在原地。X 寫在骨架裡，三個面板自動都有，
        繪製函式一個字都不必改。常駐形態用 CSS 換回底下的文字關閉鈕。
      -->
      <aside class="rail" id="sheet" aria-hidden="true">
        <div class="rail-inner">
          <button class="btn-x" id="closeX" type="button" data-close="1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
          <div class="rail-scroll" id="panel"></div>
          <!--
            選寶可夢面板多選時的動作列。在捲動區外面，所以選完不必
            捲到底就按得到「加入」。只有那個面板會填它，其餘一律隱藏。
          -->
          <div class="pick-foot" id="pickFoot" hidden></div>
        </div>
      </aside>
    </div>

    <!--
      設定。原本這些是左側欄的兩個區塊，側欄拆掉之後整段搬進來。
      深淺色也在裡面，頂部列不再有那顆半黑半白的圓。

      **放在 header 外面**：它是置中的彈窗，而 `.topbar` 是 sticky 帶 z-index，
      會開一個 stacking context，關在裡面的話 fixed 再高也蓋不過右欄的彈窗。
      結構跟右欄一樣是三層：遮罩、置中的殼、捲動區。
    -->
    <div class="modal" id="settings" hidden>
      <div class="modal-inner">
        <button class="btn-x" id="settingsX" type="button" data-closepop="1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <div class="modal-scroll">
          <section class="side-block">
            <p class="side-title" id="displayTitle"></p>
            <div class="toggles" id="displayOpts"></div>
          </section>
          <!--
            搜尋字串的語言。這串字是給**對方**貼進遊戲的，所以跟的是
            對方遊戲的語言，不是這個站的介面語言，兩者不必一致。
            預設「跟介面」，需要改的是少數，所以收在設定裡不佔交換表的版面。
          -->
          <section class="side-block">
            <p class="side-title" id="strLangTitle"></p>
            <p class="opt-label" id="strLangHint"></p>
            <div class="langs seg-fit" id="strLangs"></div>
          </section>
          <section class="side-block">
            <p class="side-title" id="dataTitle"></p>
            <div class="data-actions" id="dataActions"></div>
            <p class="notice" id="localNotice"></p>
          </section>
          <!--
            版本號是註腳不是設定項，所以不包成 side-block，
            就一行小字貼在捲動區最底下。值由 renderChrome 從 js/version.js 填。
          -->
          <p class="ver" id="verLine"></p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
