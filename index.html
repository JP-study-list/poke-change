<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>交換表 · Pokémon GO 交換清單製作</title>
    <meta name="description" content="用圖鑑找出活動裝扮、地區型與背卡寶可夢，排出想要與可以給的交換清單，一鍵產生分享圖。" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!--
      骨架而已。所有內容由 js/ui.js 在執行時填入，
      這裡只保留容器與不會變的結構。

      圖示用 inline SVG 不用文字符號。☰ 與 ◐ 是字，
      跨平台的字重與基線會飄，也吃不到 currentColor 以外的控制。
    -->
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="選單">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
      <div class="brand">
        <strong id="appName">交換表</strong>
        <span id="subtitle" class="dim"></span>
      </div>
      <div class="top-right">
        <div class="langs" id="langs"></div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="深色模式">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </header>

    <!--
      資訊列。抄 Scryfall 頂部那條：現在在看哪一批、幾筆、篩掉了什麼。
      原本這些資訊是內容區裡一行 15px 的小標題，沒有地位。
    -->
    <div class="infobar" id="infobar"></div>

    <div class="scrim" id="scrim" hidden></div>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <nav class="views" id="views"></nav>
        <section class="side-block">
          <p class="side-title" id="displayTitle"></p>
          <div class="toggles" id="displayOpts"></div>
        </section>
        <section class="side-block">
          <p class="side-title" id="dataTitle"></p>
          <div class="data-actions" id="dataActions"></div>
          <p class="notice" id="localNotice"></p>
        </section>
      </aside>

      <main class="content">
        <!--
          搜尋列。36 個篩選條件收在漏斗裡，已選的那幾個排在漏斗右邊，
          沒選就什麼都不長，這一行只有搜尋框。

          面板放在搜尋列裡面，靠 absolute 浮在下方，所以不佔流排、
          不會把搜尋框推窄；900 以下同一段 DOM 變成底部抽屜。
        -->
        <div class="searchbar" id="searchbar">
          <input id="q" type="search" autocomplete="off" />
          <button
            class="icon-btn fbtn"
            id="filterBtn"
            type="button"
            aria-expanded="false"
            aria-controls="fpanel"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 5h18l-7 8.5V20l-4-2.5v-4z" />
            </svg>
            <span class="fbtn-n" id="filterN" hidden></span>
          </button>
          <div class="fpicked" id="fpicked"></div>
          <div class="fpanel" id="fpanel" hidden></div>
        </div>
        <div id="app"></div>
      </main>

      <!--
        右欄。1200 以上是版面的第三欄，常駐；以下退回原本的底部／側邊彈出。
        DOM 位置只有一處，兩種形態靠 CSS 切換，繪製函式不必知道自己在哪。
      -->
      <aside class="rail" id="sheet" aria-hidden="true">
        <div class="rail-inner" id="panel"></div>
      </aside>
    </div>

    <div class="toast" id="toast" hidden></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden />

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
